name: push-to-cachix

on:
  push:
    branches: [main]
    # Skip documentation-only pushes. Keep Markdown prompts under codex-rs
    # eligible for builds because they can be embedded in the executable.
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'SECURITY.md'
      - 'AGENTS.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  push-to-cachix:
    runs-on: ${{ matrix.os }}
    environment: hooreique
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04-arm, ubuntu-24.04]

    steps:
      - name: Check Cachix configuration
        run: test "${{ vars.CACHIX_CACHE != '' && secrets.CACHIX_AUTH_TOKEN != '' }}" = true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build on macOS
        if: runner.os == 'macOS'
        run: nix build .#default --no-write-lock-file --print-build-logs

      - name: Build on Ubuntu
        if: runner.os == 'Linux'
        shell: bash
        run: |
          report_resources() {
            date -u
            free -m
            df -h /nix "$RUNNER_TEMP"
          }

          (
            while true; do
              report_resources
              sleep 60
            done
          ) &
          monitor_pid=$!
          trap 'kill "$monitor_pid" 2>/dev/null || true; report_resources || true' EXIT

          nix build .#default --no-write-lock-file --print-build-logs --max-jobs 1 --cores 2
