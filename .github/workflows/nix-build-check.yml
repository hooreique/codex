name: nix-build-check

on:
  pull_request:
    paths:
      - 'codex-rs/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/nix-build-check.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04-arm, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      - run: nix flake check --no-build --all-systems --no-write-lock-file

      - run: nix build .#default --no-write-lock-file --print-build-logs
